<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Эрүүл Мэндийн Эрсдэл</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: sticky-free single column shell. View 1 = intro (hero + illustrated guide + warning). View 2 = calculator (form left, result right). Zones on every scale use one green / amber / red system, separate from the aqua accent. */
:root{
  --bg:#f1f8f8; --surface:#ffffff; --surface-2:#e8f4f4; --line:#d3e6e6;
  --fg:#0d2b30; --muted:#587479; --accent:#0e9aa7; --accent-soft:#d9f0f2; --accent-fg:#ffffff;
  --low:#12936b; --low-bg:#dcf4ea; --mid:#9a6200; --mid-bg:#fbefcf; --high:#c4352f; --high-bg:#fbe3e1;
  --zg:#bfe9d9; --zw:#f6dfa0; --zr:#f3b8b3; --zn:#d3e6e6;
  --shadow:0 1px 2px rgba(13,43,48,.05),0 8px 24px rgba(14,100,110,.07);
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08191c; --surface:#0f2529; --surface-2:#143036; --line:#1f3f45;
  --fg:#e3f3f4; --muted:#8fb0b4; --accent:#3cc4d1; --accent-soft:#123a40; --accent-fg:#04191c;
  --low:#4fd5a5; --low-bg:#10372c; --mid:#f0b94a; --mid-bg:#3a2d0f; --high:#ff7f78; --high-bg:#411b1a;
  --zg:#1b5a48; --zw:#6b5214; --zr:#6e2d2a; --zn:#1f3f45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08191c; --surface:#0f2529; --surface-2:#143036; --line:#1f3f45;
  --fg:#e3f3f4; --muted:#8fb0b4; --accent:#3cc4d1; --accent-soft:#123a40; --accent-fg:#04191c;
  --low:#4fd5a5; --low-bg:#10372c; --mid:#f0b94a; --mid-bg:#3a2d0f; --high:#ff7f78; --high-bg:#411b1a;
  --zg:#1b5a48; --zw:#6b5214; --zr:#6e2d2a; --zn:#1f3f45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
a{color:var(--accent)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--fg);font-weight:800;letter-spacing:-.01em;font-size:17px}
.logo{width:40px;height:40px;border-radius:13px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
.toggle{margin-left:auto;font:inherit;font-size:13px;font-weight:600;background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer}
.toggle:focus-visible,.btn:focus-visible,.help:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;letter-spacing:-.02em;margin:0}
.btn{font:inherit;font-weight:700;border-radius:12px;padding:13px 22px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:disabled{opacity:.55;cursor:wait}
.sec{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 4px}

/* ---------- intro ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:32px;align-items:center;margin-bottom:44px}
.hero h1{font-size:clamp(30px,5vw,46px);font-weight:800;line-height:1.08}
.hero p.lead{font-size:17px;color:var(--muted);margin:16px 0 24px;max-width:46ch}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hero small{color:var(--muted);font-size:13px}
.art{position:relative;max-width:420px;margin-inline:auto;width:100%}
.art svg{display:block;width:100%;height:auto}
.chip-f{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px;box-shadow:var(--shadow);font-size:12.5px;font-weight:700;display:flex;gap:8px;align-items:center;white-space:nowrap}
.chip-f i{width:9px;height:9px;border-radius:50%;background:var(--low)}
.chip-f small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.c1{left:-2%;top:12%} .c2{right:-2%;top:44%} .c3{left:6%;bottom:6%}
.c2 i{background:var(--mid)}
.block{margin-bottom:44px}
.block>h2{font-size:clamp(22px,3vw,28px);font-weight:800;margin-bottom:6px}
.block>p{color:var(--muted);margin:0 0 20px;max-width:62ch}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;counter-reset:s}
.step{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:6px}
.step b{font-size:12px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.step h3{font-size:16px;font-weight:800}
.step p{margin:0;color:var(--muted);font-size:14px}
.guides{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.guide{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:10px;align-content:start}
.ic{width:52px;height:52px;border-radius:15px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.ic svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.guide h3{font-size:15.5px;font-weight:800}
.guide p{margin:0;font-size:13.5px;color:var(--muted)}
.guide .n{font-size:12.5px;font-weight:700;color:var(--fg);background:var(--surface-2);border-radius:8px;padding:4px 8px;justify-self:start}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;background:var(--high-bg);color:var(--fg);border:1px solid var(--zr);border-radius:20px;padding:20px}
.alert .ai{width:44px;height:44px;border-radius:13px;background:var(--high);display:grid;place-items:center}
.alert .ai svg{width:24px;height:24px;stroke:var(--surface);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.alert h3{font-size:16px;font-weight:800;margin-bottom:6px;color:var(--high)}
.alert ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.factors{display:flex;flex-wrap:wrap;gap:8px}
.factors span{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:13.5px;font-weight:600}
.endcta{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:var(--accent);color:var(--accent-fg);border-radius:22px;padding:24px 28px}
.endcta h2{font-size:clamp(20px,3vw,26px);font-weight:800}
.endcta .btn{background:var(--surface);color:var(--fg);border-color:var(--surface)}
@media(max-width:900px){.guides{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}.steps{grid-template-columns:minmax(0,1fr)}}
@media(max-width:480px){.guides{grid-template-columns:minmax(0,1fr)}.alert{grid-template-columns:minmax(0,1fr)}}

/* ---------- calculator ---------- */
.back{display:inline-flex;gap:6px;align-items:center;font-weight:600;font-size:14px;text-decoration:none;margin-bottom:14px;color:var(--muted)}
.ph{margin-bottom:22px}
.ph h1{font-size:clamp(22px,3.4vw,30px);font-weight:800}
.ph p{margin:4px 0 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:22px;min-width:0}
.sec:not(:first-child){margin-top:26px}
.field{padding:16px 0;border-bottom:1px solid var(--line)}
.field:last-of-type{border-bottom:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.lw{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.lw label,.lw .lab{font-weight:700}
.hint{color:var(--muted);font-size:12.5px;font-weight:500}
.help{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--accent);font:inherit;font-weight:800;font-size:12px;line-height:1;cursor:pointer;display:inline-grid;place-items:center;padding:0;align-self:center}
.help[aria-expanded=true]{background:var(--accent);color:var(--accent-fg)}
.helpbox{margin:10px 0 0;background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:13.5px;display:grid;gap:6px}
.helpbox b{font-weight:800}
.num{display:flex;align-items:baseline;gap:4px}
.num input{width:78px;font:inherit;font-weight:700;font-size:16px;text-align:right;color:var(--fg);background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:4px 8px;font-variant-numeric:tabular-nums}
.num input:focus{outline:2px solid var(--accent)}
.num .u{color:var(--muted);font-size:12.5px;min-width:30px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;margin:8px 0 0;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:9px;border-radius:99px;background:var(--track,var(--zn))}
input[type=range]::-moz-range-track{height:9px;border-radius:99px;background:var(--track,var(--zn))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--surface);border:4px solid var(--accent);margin-top:-6.5px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--surface);border:4px solid var(--accent)}
input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.scale{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.scale .mid{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:800;font-style:normal;white-space:nowrap}
.pill.g{background:var(--low-bg);color:var(--low)} .pill.w{background:var(--mid-bg);color:var(--mid)} .pill.r{background:var(--high-bg);color:var(--high)} .pill.n{background:var(--surface-2);color:var(--muted)}
.nrm{font-weight:600}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{font:inherit;font-weight:600;font-size:14px;color:var(--muted);background:none;border:0;border-radius:9px;padding:7px 16px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(13,43,48,.18)}
.bmicalc{margin-top:12px;background:var(--surface-2);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.bmicalc .t{font-weight:700;font-size:13.5px}
.bmicalc .in{display:flex;gap:12px;flex-wrap:wrap}
.bmicalc label{display:grid;gap:3px;font-size:12.5px;color:var(--muted);font-weight:600}
.bmicalc input{width:104px;font:inherit;font-weight:700;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.bmicalc input:focus{outline:2px solid var(--accent)}
.bmicalc .o{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.actions .primary{flex:1;min-width:170px}
.result{display:grid;gap:16px;min-width:0}
.empty{display:grid;gap:10px;justify-items:start;color:var(--muted)}
.empty svg{width:64px;height:64px}
.empty h3{color:var(--fg);font-size:17px;font-weight:800}
.empty p{margin:0}
.stale{background:var(--mid-bg);color:var(--mid);border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:700}
.risk{border-radius:20px;padding:22px;transition:background .3s,color .3s}
.risk[data-level=Low]{background:var(--low-bg);color:var(--low)}
.risk[data-level=Moderate]{background:var(--mid-bg);color:var(--mid)}
.risk[data-level=High]{background:var(--high-bg);color:var(--high)}
.risk .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.risk .big{font-size:clamp(34px,6vw,46px);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0 2px}
.risk .mn{font-weight:700;font-size:16px}
.risk .sum{margin:12px 0 0;color:var(--fg);font-size:14.5px}
.bars{display:grid;gap:12px}
.bar .t{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;margin-bottom:5px}
.bar .t b{font-variant-numeric:tabular-nums}
.track{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.fill{height:100%;border-radius:99px;width:0;transition:width .45s cubic-bezier(.2,.7,.2,1)}
.h3{font-size:15px;font-weight:800;margin:0 0 4px}
.sub{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.cmps{display:grid;gap:18px}
.ct{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:13.5px}
.ct .cn{font-weight:700}
.ct .cv{font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:center}
.ctrack{position:relative;height:9px;border-radius:99px;background:var(--track,var(--zn));margin:12px 9px 6px}
.ctrack i{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--surface);border:4px solid var(--fg);transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.cs{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px}
.tips{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tips li{display:grid;grid-template-columns:10px minmax(0,1fr);gap:12px;font-size:14px}
.tips i{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--low)}
.tips i.w{background:var(--mid)} .tips i.d{background:var(--high)}
.dl{display:grid;gap:10px}
.dl p{margin:0;font-size:13.5px;color:var(--muted)}
.dl .msg{font-size:13px;font-weight:700;color:var(--low);min-height:1.2em}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ================= v2.0 additions ================= */
.top{gap:10px}
.lang{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;margin-left:auto}
.lang button{font:inherit;font-weight:700;font-size:13px;color:var(--muted);background:none;border:0;border-radius:9px;padding:6px 11px;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;transition:background .2s,color .2s}
.lang button:hover{color:var(--fg)}
.lang button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(13,43,48,.18)}
.lang button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.lang .short{display:none}
.toggle{margin-left:0;display:inline-flex;gap:7px;align-items:center;transition:border-color .2s,color .2s}
.toggle:hover{border-color:var(--accent);color:var(--fg)}
.toggle svg{width:16px;height:16px;flex:none}
@media(max-width:520px){.lang .full{display:none}.lang .short{display:inline}.toggle .tt{display:none}.toggle{padding:8px 10px}}
@media(max-width:380px){.brand .bt{display:none}}

/* motion */
.view{animation:rise .38s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#out>*{animation:rise .42s ease both}
#out>*:nth-child(2){animation-delay:.05s}#out>*:nth-child(3){animation-delay:.1s}#out>*:nth-child(4){animation-delay:.15s}#out>*:nth-child(5){animation-delay:.2s}#out>*:nth-child(6){animation-delay:.25s}
.btn{transition:transform .15s,box-shadow .2s,background .2s,border-color .2s,filter .2s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px rgba(14,100,110,.16);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07)}
.btn:active:not(:disabled){transform:none;box-shadow:none}
.step,.guide,.panel{transition:transform .2s,box-shadow .2s,border-color .2s}
.step:hover,.guide:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--accent)}
.help{transition:background .15s,color .15s,transform .15s}
.help:hover{background:var(--accent);color:var(--accent-fg);transform:scale(1.08)}
.seg button{transition:background .15s,color .15s}
.seg button:hover:not([aria-pressed=true]){color:var(--fg)}

/* beating heart + ECG (transform/opacity only) */
.heart{transform-box:fill-box;transform-origin:50% 60%;animation:beat 1.5s ease-in-out infinite}
.hglow{transform-box:fill-box;transform-origin:center;animation:glow 1.5s ease-in-out infinite}
.ecg{stroke-dasharray:100;animation:ecg 3s linear infinite}
.logo{animation:logobeat 1.5s ease-in-out infinite}
@keyframes beat{0%{transform:scale(1)}10%{transform:scale(1.06)}20%{transform:scale(1)}32%{transform:scale(1.09)}48%,100%{transform:scale(1)}}
@keyframes glow{0%{opacity:.35;transform:scale(.96)}10%{opacity:.7;transform:scale(1.02)}20%{opacity:.4;transform:scale(.97)}32%{opacity:.9;transform:scale(1.06)}48%,100%{opacity:.35;transform:scale(.96)}}
@keyframes ecg{0%{stroke-dashoffset:100}50%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}
@keyframes logobeat{0%{transform:scale(1)}10%{transform:scale(1.05)}20%{transform:scale(1)}32%{transform:scale(1.07)}48%,100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.heart,.hglow,.logo,.view,#out>*{animation:none!important}.ecg{animation:none!important;stroke-dasharray:none}.hglow{opacity:.5}}

/* privacy + footer */
.privacy{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 20px}
.privacy .si{width:46px;height:46px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.privacy .si svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.privacy h3{font-size:16px;font-weight:800;margin-bottom:2px}
.privacy p{margin:0;color:var(--muted);font-size:13.5px}
.pchip{display:inline-flex;gap:8px;align-items:center;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 16px}
.pchip svg{width:16px;height:16px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sitefoot{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);line-height:1.55;max-width:80ch}

/* results dashboard */
.risk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 18px;align-items:center}
.risk .rt{min-width:0}
.ring{width:132px;height:132px;display:block}
.ring .rp{font-size:26px;font-weight:800;fill:currentColor;font-family:var(--font)}
.ring .rl{font-size:11px;font-weight:700;fill:currentColor;letter-spacing:.06em;text-transform:uppercase;font-family:var(--font)}
@media(max-width:440px){.risk{grid-template-columns:minmax(0,1fr);justify-items:start}}
.expl{margin:0 0 16px;font-size:14px}
.expl .e2{display:block;color:var(--muted);margin-top:6px;font-size:13px}
.frows{display:grid;gap:13px}
.fr .t{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.fr .nm{font-weight:700}
.fr .vl{display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.wb{display:flex;align-items:center;gap:10px;margin-top:5px}
.wb .tr{flex:1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.wb .tr i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.wb small{font-size:11.5px;color:var(--muted);min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
.warn{color:var(--high);font-size:12.5px;font-weight:600;margin-top:8px}

input[aria-invalid=true]{outline:2px solid var(--high)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:140px}

/* ================= v2.1 additions: My Health Dashboard ================= */
.navlink{display:inline-flex;gap:8px;align-items:center;margin-left:auto;font-weight:700;font-size:13.5px;color:var(--fg);text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px;white-space:nowrap;transition:border-color .2s,transform .15s}
.navlink svg{width:16px;height:16px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.navlink:hover{border-color:var(--accent);transform:translateY(-1px)}
.navlink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lang{margin-left:0}
@media(max-width:700px){.navlink .nt{display:none}.navlink{padding:8px 10px}}
@media(max-width:460px){.brand .bt{display:none}}
.dtabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media(max-width:860px){.dtabs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dtab{font:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:8px;cursor:pointer;color:var(--fg);transition:transform .18s,border-color .2s,background .2s,box-shadow .2s;min-width:0}
.dtab .ic{width:40px;height:40px;border-radius:12px;transition:background .2s,color .2s}
.dtab .ic svg{width:22px;height:22px}
.dtab b{font-size:14.5px;font-weight:800;line-height:1.25}
.dtab small{color:var(--muted);font-size:12px;font-weight:600}
.dtab:hover{transform:translateY(-2px);border-color:var(--accent)}
.dtab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dtab[aria-selected=true]{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--shadow)}
.dtab[aria-selected=true] .ic{background:var(--accent);color:var(--accent-fg)}
.tpanel{animation:rise .35s ease both}
.wzhead{margin-bottom:16px}
.wzt{display:flex;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;align-items:baseline;margin-bottom:12px}
.wzt b{font-size:16px;font-weight:800}
.wzt span{color:var(--muted);font-size:13px;font-weight:600}
.wzbar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.wzbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s cubic-bezier(.2,.7,.2,1)}
.wzsteps{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.wzsteps button{font:inherit;width:100%;display:grid;gap:2px;justify-items:start;text-align:left;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--surface-2);border:1px solid transparent;border-radius:12px;padding:8px 10px;cursor:pointer;transition:background .2s,color .2s,border-color .2s;min-width:0}
.wzsteps button:disabled{cursor:default;opacity:.6}
.wzsteps button[aria-current=step]{background:var(--accent-soft);color:var(--fg);border-color:var(--accent)}
.wzsteps button.done{color:var(--low)}
.wzsteps small{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.wzsteps span{overflow-wrap:anywhere;line-height:1.25}
.wzhint{margin:12px 0 0;font-size:12.5px;color:var(--muted)}
.wz .grid{grid-template-columns:minmax(0,1fr)}
.wz .actions,.wz .sec{display:none}
#fields[data-step="1"] [data-step]:not([data-step="1"]),#fields[data-step="2"] [data-step]:not([data-step="2"]),#fields[data-step="3"] [data-step]:not([data-step="3"]),#fields[data-step="4"] [data-step]{display:none}
.wz[data-step="4"] #form{display:none}
.wz:not([data-step="4"]) #result{display:none}
.wznav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.wznav .btn{min-width:130px}
.wznav .btn.primary{margin-left:auto}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--high);border-color:var(--zr)}
.btn.danger:hover:not(:disabled){border-color:var(--high)}
.btn.dangerfill{background:var(--high);color:var(--surface);border-color:var(--high)}
/* charts */
.chartwrap{display:grid;gap:26px}
.cblock{display:grid;gap:10px;min-width:0}
.cblock h4{margin:0;font-size:14px;font-weight:800}
.cblock p.sub{margin:-4px 0 4px}
.arc{width:100%;max-width:340px;margin:0 auto;display:block;overflow:visible}
.arcseg{cursor:pointer;transition:opacity .2s,stroke-width .2s;animation:arcIn 1s cubic-bezier(.2,.7,.2,1) both}
.arcseg:hover,.arcseg:focus-visible{stroke-width:29}
.arcseg:focus-visible{outline:none}
@keyframes arcIn{from{stroke-dasharray:0 200}}
.chartwrap[data-sel="Low"] .arcseg:not([data-c="Low"]),.chartwrap[data-sel="Moderate"] .arcseg:not([data-c="Moderate"]),.chartwrap[data-sel="High"] .arcseg:not([data-c="High"]){opacity:.4}
.carc-p{font-family:var(--font);font-size:30px;font-weight:800;fill:var(--fg)}
.carc-l{font-family:var(--font);font-size:11.5px;font-weight:700;fill:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{font:inherit;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--fg);border:1px solid var(--line);border-radius:99px;padding:6px 12px;display:inline-flex;gap:8px;align-items:center;cursor:pointer;transition:border-color .2s,background .2s}
.chip i{width:10px;height:10px;border-radius:50%;flex:none}
.chip:hover,.chip:focus-visible{border-color:var(--accent);outline:none}
.chartwrap[data-sel="Low"] .chip[data-c="Low"],.chartwrap[data-sel="Moderate"] .chip[data-c="Moderate"],.chartwrap[data-sel="High"] .chip[data-c="High"]{border-color:var(--accent);background:var(--accent-soft)}
.cdetail{background:var(--surface-2);border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:600;min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center}
.radar{width:100%;max-width:380px;margin:0 auto;display:block}
.rring{fill:none;stroke:var(--line);stroke-width:1}
.raxis{stroke:var(--line);stroke-width:1}
.rband{fill:var(--zg);fill-opacity:.75;fill-rule:evenodd}
.rpoly{fill:var(--accent);fill-opacity:.2;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;transform-origin:170px 150px;animation:polyIn .85s cubic-bezier(.2,.7,.2,1) both}
@keyframes polyIn{from{transform:scale(0);opacity:0}}
.rdot{cursor:pointer;stroke:var(--surface);stroke-width:2.5;transform-box:fill-box;transform-origin:center;transition:transform .15s;animation:dotIn .5s .55s both}
@keyframes dotIn{from{opacity:0}}
.rdot:hover,.rdot:focus-visible,.rdot.on{transform:scale(1.4);outline:none}
.rdot.g{fill:var(--low)}.rdot.w{fill:var(--mid)}.rdot.r{fill:var(--high)}
.rlab{font-family:var(--font);font-size:11.5px;font-weight:700;fill:var(--fg)}
.stat{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;background:var(--surface-2)}
.stat i{display:block;height:100%;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.stat i.g{background:var(--low)}.stat i.w{background:var(--mid)}.stat i.r{background:var(--high)}
.statline{font-size:13px;color:var(--muted);font-weight:600}
@media(max-width:560px){.wzsteps button span{display:none}.wzsteps button{justify-items:center;padding:8px 4px}.wzsteps small{font-size:13px}}
@media(prefers-reduced-motion:reduce){.arcseg,.rpoly,.rdot,.tpanel{animation:none!important}}
/* history */
.htools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.htools .hint2{font-size:12.5px;color:var(--muted);flex:1;min-width:160px}
.hlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface-2);border-radius:14px;padding:12px 14px}
.hrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);cursor:pointer}
.hmain{display:grid;gap:3px;min-width:0}
.hmain b{font-size:14px}
.hmain span{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);font-weight:600;flex-wrap:wrap}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:520px){.hrow{grid-template-columns:auto minmax(0,1fr)}.hbtns{grid-column:1/-1;justify-content:flex-start}}
.hmode{margin:16px 0;border:1px solid var(--line);border-radius:18px;padding:18px;background:var(--surface)}
.hmode .top2{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tscroll{overflow-x:auto}
.ctab{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
.ctab th,.ctab td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.ctab th{background:var(--surface-2);font-size:12px;font-weight:800}
.ctab td.num2{font-variant-numeric:tabular-nums}
.msgline{font-size:13px;font-weight:700;color:var(--low);min-height:1.2em;margin-top:8px}
.msgline.bad{color:var(--high)}
.confirmbox{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--high-bg);color:var(--fg);border:1px solid var(--zr);border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:600}
/* privacy */
.swrow{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;background:var(--surface-2);border-radius:16px;padding:16px}
.swrow p{margin:4px 0 0;color:var(--muted);font-size:13.5px;max-width:56ch}
.switch{font:inherit;display:inline-flex;align-items:center;gap:10px;font-weight:700;background:none;border:0;cursor:pointer;color:var(--fg);padding:4px;border-radius:12px}
.switch i{width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;flex:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-checked=true] i{background:var(--accent)}
.switch[aria-checked=true] i::after{transform:translateX(20px)}
.switch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pgrid{display:grid;gap:16px}
.plist{margin:0;padding-left:20px;display:grid;gap:8px;font-size:14px}
.kv{display:flex;gap:8px;flex-wrap:wrap}
.kv span{background:var(--surface-2);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">

  </div>

  <!-- ================= INTRO ================= -->

        <svg viewBox="0 0 360 320" fill="none">
          <defs><radialGradient id="hg"><stop offset="0" stop-color="#ff5c7c" stop-opacity=".6"/><stop offset="1" stop-color="#ff5c7c" stop-opacity="0"/></radialGradient></defs>
          <circle cx="180" cy="160" r="140" fill="var(--accent-soft)"/>

          <circle cx="62" cy="244" r="8" fill="var(--zg)"/><circle cx="318" cy="248" r="5" fill="var(--zw)"/><circle cx="52" cy="92" r="5" fill="var(--zr)"/>
        </svg>

        <div class="chip-f c2"><i></i><span><span data-i18n="chipGlu"></span><small data-i18n="chipGluv"></small></span></div>

        <div class="guide"><div class="ic"><svg viewBox="0 0 48 48"><path d="M24 6C24 6 10 22 10 31a14 14 0 0 0 28 0C38 22 24 6 24 6z"/><path d="M18 32a6 6 0 0 0 6 6"/></svg></div><h3 data-i18n="g2h"></h3><p data-i18n="g2p"></p><span class="n" data-i18n="g2n"></span></div>

        <div class="guide"><div class="ic"><svg viewBox="0 0 48 48"><rect x="7" y="9" width="34" height="30" rx="8"/><path d="M15 22a12 10 0 0 1 18 0M24 28l5-6"/></svg></div><h3 data-i18n="g4h"></h3><p data-i18n="g4p"></p><span class="n" data-i18n="g4n"></span></div>

function predict(x){

  for(const root of roots){let n=root;while(f[n]>=0)n=xs[f[n]]<=t[n]?l[n]:r[n];const lv=v[r[n]];p[0]+=lv[0];p[1]+=lv[1];p[2]+=lv[2]}
  const out={};classes.forEach((c,i)=>out[c]=p[i]/roots.length);return out;
}

function advice(s){
  const a=[],add=(cls,h,k,v)=>a.push({cls,h,k,v});
  if(s.BMI>=30)add('d','weight','bmiObese',s.BMI);
  else if(s.BMI>=25)add('w','weight','bmiOver',s.BMI);
  else if(s.BMI<18.5)add('w','weight','bmiUnder',s.BMI);
  if(s.Systolic_BP>=140)add('d','bp','bpHigh',s.Systolic_BP);
  else if(s.Systolic_BP>=130)add('w','bp','bpElev',s.Systolic_BP);
  if(s.Glucose>=126)add('d','glu','gluHigh',s.Glucose);
  else if(s.Glucose>=100)add('w','glu','gluWatch',s.Glucose);
  if(s.Cholesterol>=240)add('d','chol','cholHigh',s.Cholesterol);
  else if(s.Cholesterol>=200)add('w','chol','cholWatch',s.Cholesterol);
  if(s.Smoking)add('d','smoke','smoke');
  if(s.Exercise_Days_Per_Week<3)add('w','move','exLow',s.Exercise_Days_Per_Week);
  if(s.Sleep_Hours<7)add('w','sleep','sleepLow',s.Sleep_Hours);
  else if(s.Sleep_Hours>9)add('w','sleep','sleepHigh',s.Sleep_Hours);
  if(s.Family_History)add('w','fam','fam');
  if(!a.length)add('','good','good');
  return a;
}

function ring(p,level){

  const lab=t('ringAria',{a:Math.round(p.Low*100),b:Math.round(p.Moderate*100),c:Math.round(p.High*100)});
  return `<svg class="ring" viewBox="0 0 140 140" role="img" aria-label="${lab}"><g transform="rotate(-90 70 70)"><circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--surface)" stroke-width="16" opacity=".7"/>${segs}</g><text class="rp" x="70" y="72" text-anchor="middle">${Math.round(p[level]*100)}%</text><text class="rl" x="70" y="90" text-anchor="middle">${LV[level].name}</text></svg>`;
}

/* v2: PDF without external libraries: the report is drawn on canvas pages, saved as JPEG and wrapped in a minimal PDF */
function pdfFromJPEGs(jpgs,w,h){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=b=>{if(typeof b==='string')b=enc.encode(b);parts.push(b);len+=b.length};
  const obj=(n,fn)=>{offs[n]=len;push(n+' 0 obj\n');fn();push('\nendobj\n')};
  const N=jpgs.length,total=3+3*N;
  push('%PDF-1.4\n');
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push(`<< /Type /Pages /Kids [${jpgs.map((_,i)=>(3+3*i)+' 0 R').join(' ')}] /Count ${N} >>`));
  jpgs.forEach((j,i)=>{
    const p=3+3*i,c='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(p,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${p+1} 0 R >> >> /Contents ${p+2} 0 R >>`));
    obj(p+1,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.length} >>\nstream\n`);push(j);push('\nendstream')});
    obj(p+2,()=>push(`<< /Length ${c.length} >>\nstream\n${c}\nendstream`));
  });
  const xo=len;
  push(`xref\n0 ${total}\n0000000000 65535 f \n`);
  for(let n=1;n<total;n++)push(String(offs[n]).padStart(10,'0')+' 00000 n \n');
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xo}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}
function drawReportPages(){

  const ensure=h=>{if(y+h>H-MY)newPage()};
  const font=(w,px)=>{cx.font=`${w} ${px}px ${FONT}`};
  const wrap=(text,maxW)=>{const out=[];let line='';for(const word of String(text).split(/\s+/)){const tst=line?line+' '+word:word;if(cx.measureText(tst).width>maxW&&line){out.push(line);line=word}else line=tst}if(line)out.push(line);return out};
  const para=(text,px,color,w='500',x=MX,maxW=CW,lh=1.5)=>{font(w,px);cx.fillStyle=color;for(const l of wrap(text,maxW)){ensure(px*lh);y+=px*lh;cx.fillText(l,x,y-px*0.3)}};

  font('800',64);cx.fillStyle=rc;cx.fillText(LV[level].name,MX+30,y+118);
  const nw=cx.measureText(LV[level].name).width;font('700',30);cx.fillText(`  ·  ${t('mn.'+level)} (${Math.round(p[level]*100)}%)`,MX+30+nw,y+118);
  font('500',22);cx.fillStyle='#587479';cx.fillText(`${t('rProb')}: Low ${(p.Low*100).toFixed(1)}% · Medium ${(p.Moderate*100).toFixed(1)}% · High ${(p.High*100).toFixed(1)}%`,MX+30,y+162);
  y+=bh;
  /* explanation */
  const flagged=factorList(s).filter(r=>r.z&&r.z[2]!=='g').map(r=>r.lab);
  h2(t('rExpl'));para(t('expBase',{l:t('lvl.'+level),p:Math.round(p[level]*100)})+' '+(flagged.length?t('expFlag',{list:flagged.join(', ')}):t('expNone')),25,'#0d2b30');
  /* table */
  h2(t('rTblH'));
  const cols=[.34,.22,.22,.22].map(f=>f*CW),cls={g:'#12936b',w:'#9a6200',r:'#c4352f'};
  const zt=z=>z?{txt:t('z.'+z[3]),col:cls[z[2]]}:{txt:'—',col:'#587479'};
  const yn=v=>v?t('Smoking.o1'):t('Smoking.o0');
  const rows=[[t('F.Age.label'),s.Age+' '+unit('Age'),'—',zt(null)],[t('Gender.label'),t('Gender.o'+s.Gender),'—',zt(null)],
   ...CMP.map(k=>[t('F.'+k+'.label'),fmt(k,s[k])+' '+unit(k),F[k].normal+' '+unit(k),zt(zoneOf(k,s[k]))]),
   [t('Smoking.label'),yn(s.Smoking),t('Smoking.o0'),zt([0,0,s.Smoking?'r':'g',s.Smoking?'riskf':'normal'])],
   [t('Family_History.label'),yn(s.Family_History),t('Family_History.o0'),zt([0,0,s.Family_History?'w':'g',s.Family_History?'attn':'normal'])]];
  const rowDraw=(cells,head)=>{
    const rh=head?56:64;ensure(rh);
    if(head){cx.fillStyle='#e8f4f4';cx.fillRect(MX,y,CW,rh)}
    let x=MX+14;
    cells.forEach((c,i)=>{const txt=typeof c==='string'?c:c.txt;font(head?'700':(i===3?'800':'500'),head?22:23);cx.fillStyle=head?'#0d2b30':(typeof c==='string'?'#0d2b30':c.col);
      const ls=wrap(txt,cols[i]-24).slice(0,2);ls.forEach((l,j)=>cx.fillText(l,x,y+(ls.length>1?28+j*26:rh/2+8)));x+=cols[i]});
    cx.fillStyle='#d3e6e6';cx.fillRect(MX,y+rh-2,CW,2);y+=rh;
  };
  rowDraw([t('rC1'),t('rC2'),t('rC3'),t('rC4')],true);rows.forEach(r=>rowDraw(r,false));
  /* advice */
  h2(t('rTips'));tips.forEach(x=>{para('•  '+t('h.'+x.h)+'. '+tipTxt(x),25,'#0d2b30','500',MX,CW,1.5);y+=8});

}

function cleanRec(r){
  try{
    if(!r||typeof r.id!=='string'||typeof r.ts!=='string'||!LEVELS.includes(r.level)||isNaN(Date.parse(r.ts)))return null;
    const s={};for(const k of KEYS){const v=Number(r.s&&r.s[k]);if(!isFinite(v))return null;s[k]=v}
    const p={};for(const c of LEVELS){const v=Number(r.p&&r.p[c]);if(!isFinite(v)||v<0||v>1)return null;p[c]=v}
    return {id:r.id.replace(/[^a-z0-9]/gi,'').slice(0,24),ts:r.ts,s,p,level:r.level};
  }catch(e){return null}
}

const RADAR=['BMI','Systolic_BP','Glucose','Cholesterol','Exercise_Days_Per_Week','Sleep_Hours'];
function normBand(k){const z=F[k].zones.filter(x=>x[2]==='g');return [pct(k,z[0][0])/100,pct(k,Math.min(F[k].max,z[z.length-1][1]))/100]}
function chartHTML(rec){
  const {s,p,level}=rec,CX=170,CY=150,R=88;
  /* probability arc */
  let cum=0;
  const arcTip=c=>t('cProbTip',{n:lvlLabel(c),p:(p[c]*100).toFixed(1)})+(c===level?' · '+t('cTop'):'');
  const arcs=LEVELS.map(c=>{const len=p[c]*100;const e=`<path class="arcseg" data-cs="arc" data-c="${c}" data-tip="${esc(arcTip(c))}" tabindex="0" role="button" aria-label="${esc(arcTip(c))}" d="M30 120A90 90 0 0 1 210 120" pathLength="100" fill="none" stroke="${LV[c].c}" stroke-width="24" stroke-dasharray="${len.toFixed(3)} 200" stroke-dashoffset="${(-cum).toFixed(3)}"/>`;cum+=len;return e}).join('');
  const chips=LEVELS.map(c=>`<button type="button" class="chip" data-cs="arc" data-c="${c}" data-tip="${esc(arcTip(c))}"><i style="background:${LV[c].c}"></i>${lvlLabel(c)} <b>${(p[c]*100).toFixed(1)}%</b></button>`).join('');
  /* radar */
  const ang=i=>-Math.PI/2+i*2*Math.PI/6,pt=(i,f)=>[CX+Math.cos(ang(i))*R*f,CY+Math.sin(ang(i))*R*f];
  const poly=fs=>fs.map((f,i)=>pt(i,f).map(n=>n.toFixed(1)).join(',')).join(' ');
  const rings=[.25,.5,.75,1].map(f=>`<polygon class="rring" points="${poly(RADAR.map(()=>f))}"/>`).join('');
  const axes=RADAR.map((k,i)=>{const [x,y]=pt(i,1);return `<line class="raxis" x1="${CX}" y1="${CY}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`}).join('');
  const bands=RADAR.map(normBand);
  const pathOf=fs=>'M'+fs.map((f,i)=>pt(i,f).map(n=>n.toFixed(1)).join(' ')).join('L')+'Z';
  const band=`<path class="rband" d="${pathOf(bands.map(b=>b[1]))}${pathOf(bands.map(b=>b[0]))}"/>`;
  const vals=RADAR.map(k=>pct(k,s[k])/100);
  const labs=RADAR.map((k,i)=>{const [x,y]=pt(i,1.28),c=Math.cos(ang(i));return `<text class="rlab" x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="${c>.3?'start':c<-.3?'end':'middle'}">${t('sh.'+k)}</text>`}).join('');
  const dots=RADAR.map((k,i)=>{const [x,y]=pt(i,vals[i]),z=zoneOf(k,s[k]);
    const tip=t('cIndTip',{l:t('F.'+k+'.label'),v:fmt(k,s[k])+' '+unit(k),z:t('z.'+z[3]),n:F[k].normal+' '+unit(k)});
    return `<circle class="rdot ${z[2]}" data-cs="ind" data-k="${k}" data-tip="${esc(tip)}" tabindex="0" role="button" aria-label="${esc(tip)}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7"/>`}).join('');
  /* status summary */
  const rows=factorList(s).filter(r=>r.z),cnt={g:0,w:0,r:0};rows.forEach(r=>cnt[r.z[2]]++);
  const tot=rows.length||1;
  return `<div class="chartwrap" data-sel="${level}">
   <div class="cblock"><h4>${t('cArcH')}</h4>
    <svg class="arc" viewBox="0 0 240 145" role="group" aria-label="${esc(t('cArcH'))}"><path d="M30 120A90 90 0 0 1 210 120" fill="none" stroke="var(--surface-2)" stroke-width="24"/>${arcs}<text class="carc-p" x="120" y="104" text-anchor="middle">${Math.round(p[level]*100)}%</text><text class="carc-l" x="120" y="126" text-anchor="middle">${LV[level].name}</text></svg>
    <div class="chips">${chips}</div><div class="cdetail" data-for="arc" aria-live="polite">${esc(arcTip(level))}</div></div>
   <div class="cblock"><h4>${t('cRadH')}</h4><p class="sub">${t('cRadSub')}</p>
    <svg class="radar" viewBox="0 0 340 300" role="group" aria-label="${esc(t('cRadH'))}">${rings}${axes}${band}<polygon class="rpoly" points="${poly(vals)}"/>${labs}${dots}</svg>
    <div class="cdetail" data-for="ind" aria-live="polite">${t('cHint')}</div></div>
   <div class="cblock"><h4>${t('cStat')}</h4>
    <div class="stat" role="img" aria-label="${esc(t('cStatLine',{n:cnt.g,w:cnt.w,r:cnt.r}))}"><i class="g" style="width:${(cnt.g/tot*100).toFixed(1)}%"></i><i class="w" style="width:${(cnt.w/tot*100).toFixed(1)}%"></i><i class="r" style="width:${(cnt.r/tot*100).toFixed(1)}%"></i></div>
    <div class="statline">${t('cStatLine',{n:cnt.g,w:cnt.w,r:cnt.r})}</div></div>
  </div>`;
}

function renderTabs(){
  $('dtabs').innerHTML=TABS.map(([id,tt,ts,ic])=>`<button type="button" class="dtab" role="tab" id="tab-${id}" data-tab="${id}" aria-selected="${dashTab===id}" aria-controls="tp${id[0].toUpperCase()+id.slice(1)}"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">${ic}</svg></span><b>${t(tt)}</b><small>${ts?t(ts):t('hCount',{n:loadHist().length})}</small></button>`).join('');
  $('tpAssess').hidden=dashTab!=='assess';$('tpChart').hidden=dashTab!=='chart';$('tpHist').hidden=dashTab!=='hist';$('tpPriv').hidden=dashTab!=='priv';
}
function setTab(n){dashTab=n;renderTabs();if(n==='chart')renderChartTab();if(n==='hist')renderHistory();if(n==='priv')renderPrivacy();$('dtabs').scrollIntoView({behavior:'smooth',block:'start'})}

function renderChartTab(){
  const host=$('dChart');let rec=last,note='';
  if(!rec){const h=loadHist();if(h.length){rec=h[h.length-1];note=t('cFromSaved',{d:fdate(rec.ts)})}}
  host.innerHTML=rec?`<p class="h3">${t('cH')}</p><p class="sub">${note||t('cSub')}</p>`+chartHTML(rec)
   :`<div class="empty"><svg viewBox="0 0 64 64" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="10" y="8" width="44" height="48" rx="10" fill="var(--accent-soft)"/><path d="M20 44V30M30 44V20M40 44V34"/></svg><p>${t('cNone')}</p><button class="btn primary" type="button" data-act="cGo">${t('cGo')}</button></div>`;
}

/* ---------- history ---------- */
function rankOf(z){return z?{g:0,w:1,r:2}[z[2]]:null}
function recDetail(rec){
  const {s,p,level}=rec,rows=factorList(s),tips=advice(s);
  return `<div class="risk" data-level="${level}"><div class="rt"><div class="k">${t('riskK')}</div><div class="big">${LV[level].name}</div><div class="mn">${t('mn.'+level)} · ${Math.round(p[level]*100)}%</div></div>${ring(p,level)}</div>
  <div class="frows" style="margin:16px 0">${rows.map(r=>`<div class="fr"><div class="t"><span class="nm">${r.lab}</span><span class="vl"><b>${r.val}</b> ${r.z?`<em class="pill ${r.z[2]}">${t('z.'+r.z[3])}</em>`:''}</span></div></div>`).join('')}</div>
  ${chartHTML(rec)}
  <ul class="tips" style="margin-top:16px">${tips.map(x=>`<li><i class="${x.cls}"></i><span><b>${t('h.'+x.h)}.</b> ${tipTxt(x)}</span></li>`).join('')}</ul>`;
}
function compareHTML(a,b){
  if(Date.parse(a.ts)>Date.parse(b.ts))[a,b]=[b,a];
  const fa=Object.fromEntries(factorList(a.s).map(r=>[r.k,r])),fb=Object.fromEntries(factorList(b.s).map(r=>[r.k,r]));
  const verdict=(ra,rb)=>{if(ra==null||rb==null||ra===rb)return `<em class="pill n">${t('hcSame')}</em>`;return rb<ra?`<em class="pill g">${t('hcBetter')}</em>`:`<em class="pill r">${t('hcWorse')}</em>`};
  const rows=KEYS.map(k=>{
    const ra=fa[k],rb=fb[k];let chg;
    if(SEG.includes(k))chg=a.s[k]===b.s[k]?'—':`${ra.val} → ${rb.val}`;
    else{const d=Math.round((b.s[k]-a.s[k])*10)/10;chg=d===0?'0':(d>0?'+':'')+d+' '+unit(k)}
    return `<tr><td>${ra.lab}</td><td class="num2">${ra.val}${ra.z?' '+pill(ra.z):''}</td><td class="num2">${rb.val}${rb.z?' '+pill(rb.z):''}</td><td class="num2">${chg} ${verdict(rankOf(ra.z),rankOf(rb.z))}</td></tr>`}).join('');
  const lvA=LEVELS.indexOf(a.level),lvB=LEVELS.indexOf(b.level);
  const pr=p=>`${(p.Low*100).toFixed(1)} / ${(p.Moderate*100).toFixed(1)} / ${(p.High*100).toFixed(1)}%`;
  const dp=LEVELS.map(c=>{const d=Math.round((b.p[c]-a.p[c])*1000)/10;return (d>0?'+':'')+d}).join(' / ');
  return `<div class="tscroll"><table class="ctab"><tr><th>${t('hcInd')}</th><th>${t('hcOld')}<br><small>${fdate(a.ts)}</small></th><th>${t('hcNew')}<br><small>${fdate(b.ts)}</small></th><th>${t('hcChange')}</th></tr>
  <tr><td><b>${t('hcLevel')}</b></td><td>${lvlPill(a.level)}</td><td>${lvlPill(b.level)}</td><td>${verdict(lvA,lvB)}</td></tr>
  <tr><td>${t('hcProb')}</td><td class="num2">${pr(a.p)}</td><td class="num2">${pr(b.p)}</td><td class="num2">${dp} pp</td></tr>${rows}</table></div><p class="sub" style="margin-top:12px">${t('hcNote')}</p>`;
}
function renderHistory(){
  const host=$('dHist'),all=loadHist(),a=all.slice().reverse();
  let html=`<p class="h3">${t('hH')}</p><p class="sub">${t('hSub')}</p>`;
  if(histMode&&histMode.type==='view'){const r=all.find(x=>x.id===histMode.id);if(r)html+=`<div class="hmode"><div class="top2"><b>${t('hSavedRes')} · ${fdate(r.ts)}</b><button class="btn sm" type="button" data-act="closeMode">${t('hClose')}</button></div>${recDetail(r)}</div>`;else histMode=null}
  if(histMode&&histMode.type==='cmp'){const ra=all.find(x=>x.id===histMode.a),rb=all.find(x=>x.id===histMode.b);if(ra&&rb)html+=`<div class="hmode"><div class="top2"><b>${t('hcH')}</b><button class="btn sm" type="button" data-act="closeMode">${t('hClose')}</button></div>${compareHTML(ra,rb)}</div>`;else histMode=null}
  if(!a.length){html+=`<div class="empty"><svg viewBox="0 0 64 64" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="32" cy="32" r="22" fill="var(--accent-soft)"/><path d="M32 20v13l8 5"/></svg><h3>${t('hEmpty')}</h3><p>${t('hEmptyP')}</p></div>`}
  else{
    const ids=new Set(all.map(r=>r.id));[...cmpSel].forEach(id=>{if(!ids.has(id))cmpSel.delete(id)});
    const ready=cmpSel.size===2;
    html+=`<div class="htools"><button class="btn sm primary" type="button" data-act="compare" ${ready?'':'disabled'}>${t('hCmpBtn')}</button>
      <span class="hint2">${ready?'':t('hCmpHint')}</span>
      ${confirmDel==='*'?`<div class="confirmbox">${t('hConfirm')} <button class="btn sm dangerfill" type="button" data-act="delYes" data-id="*">${t('hYes')}</button><button class="btn sm" type="button" data-act="delNo">${t('hNo')}</button></div>`:`<button class="btn sm danger" type="button" data-act="del" data-id="*">${t('hDelAll')}</button>`}</div>
      <ul class="hlist">${a.map(r=>`<li class="hrow"><input type="checkbox" data-hid="${r.id}" ${cmpSel.has(r.id)?'checked':''} aria-label="${esc(t('hSelect')+' · '+fdate(r.ts))}"><div class="hmain"><b>${fdate(r.ts)}</b><span>${lvlPill(r.level)} ${Math.round(r.p[r.level]*100)}%</span></div>
      <div class="hbtns">${confirmDel===r.id?`<div class="confirmbox">${t('hConfirm')} <button class="btn sm dangerfill" type="button" data-act="delYes" data-id="${r.id}">${t('hYes')}</button><button class="btn sm" type="button" data-act="delNo">${t('hNo')}</button></div>`:`<button class="btn sm" type="button" data-act="view" data-id="${r.id}">${t('hView')}</button><button class="btn sm danger" type="button" data-act="del" data-id="${r.id}">${t('hDel')}</button>`}</div></li>`).join('')}</ul>
      <p class="sub" style="margin-top:14px">${t('hLimit')}</p>`;
  }
  host.innerHTML=html;
}

/* ---------- privacy ---------- */
function renderPrivacy(){
  const on=consent(),n=loadHist().length;
  $('dPriv').innerHTML=`<p class="h3">${t('pH')}</p>
  <div class="pgrid">
   <div class="swrow"><div><b>${t('pSw')}</b><p>${t('pSwP')}</p></div><button class="switch" type="button" role="switch" aria-checked="${on}" data-act="toggleConsent" aria-label="${esc(t('pSw'))}"><i></i><span>${t(on?'pOn':'pOff')}</span></button></div>
   <div><p class="h3">${t('pStoredH')}</p><div class="kv"><span>${t('pStHist',{n})}</span><span>${t('pStLang',{l:t('langName')})}</span><span>${t('pStConsent',{s:t(on?'pOn':'pOff')})}</span></div>
    <div class="htools"><button class="btn sm" type="button" data-act="openHist">${t('pOpenHist')}</button></div></div>
   <div><p class="h3">${t('pDelH')}</p><p class="sub">${t('pDelP')}</p>
    ${privConfirm?`<div class="confirmbox">${t('hConfirm')} <button class="btn sm dangerfill" type="button" data-act="privYes">${t('hYes')}</button><button class="btn sm" type="button" data-act="privNo">${t('hNo')}</button></div>`:`<button class="btn danger" type="button" data-act="privDel">${t('pDelBtn')}</button>`}
    <div class="msgline ${privMsg===t('pNoStore')?'bad':''}" role="status">${privMsg}</div></div>
   <div><p class="h3">${t('pHowH')}</p><ul class="plist"><li>${t('p1')}</li><li>${t('p2')}</li><li>${t('p3')}</li><li>${t('p4')}</li><li>${t('p5')}</li></ul></div>
  </div>`;
}

/* ---------- dashboard events ---------- */
$('dash').addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){setTab(tb.dataset.tab);return}
  const st=e.target.closest('[data-wz]');if(st&&!st.disabled){wzGo(+st.dataset.wz);return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act,id=a.dataset.id;
  if(act==='wzBack'){wzGo(wzStep-1)}
  else if(act==='wzNext'){wzNext()}
  else if(act==='cGo'){setTab('assess')}
  else if(act==='view'){histMode={type:'view',id};renderHistory()}
  else if(act==='closeMode'){histMode=null;renderHistory()}
  else if(act==='compare'){const [x,y]=[...cmpSel];if(x&&y){histMode={type:'cmp',a:x,b:y};renderHistory()}}
  else if(act==='del'){confirmDel=id;renderHistory()}
  else if(act==='delNo'){confirmDel=null;renderHistory()}
  else if(act==='delYes'){
    if(id==='*'){store.remove(HK);cmpSel.clear();histMode=null}
    else{saveHist(loadHist().filter(r=>r.id!==id));cmpSel.delete(id);if(histMode&&(histMode.id===id||histMode.a===id||histMode.b===id))histMode=null}
    confirmDel=null;renderHistory();renderTabs();setSaveBtn();
  }
  else if(act==='toggleConsent'){
    const nv=!consent();
    if(store.set(CK,nv?'1':'0')){privMsg=''}else privMsg=t('pNoStore');
    renderPrivacy();renderTabs();
  }
  else if(act==='openHist'){setTab('hist')}
  else if(act==='privDel'){privConfirm=true;privMsg='';renderPrivacy()}
  else if(act==='privNo'){privConfirm=false;renderPrivacy()}
  else if(act==='privYes'){
    store.remove(HK);store.remove(CK);store.remove('hra_lang');cmpSel.clear();histMode=null;confirmDel=null;privConfirm=false;privMsg=t('pDeleted');
    renderPrivacy();renderTabs();setSaveBtn();
  }
});
$('dash').addEventListener('change',e=>{
  const c=e.target.closest('input[data-hid]');if(!c)return;
  c.checked?cmpSel.add(c.dataset.hid):cmpSel.delete(c.dataset.hid);
  const arr=[...cmpSel];while(arr.length>2)cmpSel.delete(arr.shift());
  renderHistory();const again=document.querySelector(`input[data-hid="${c.dataset.hid}"]`);if(again)again.focus();
});
function renderDash(){renderTabs();renderWizardChrome();if(dashTab==='chart')renderChartTab();if(dashTab==='hist')renderHistory();if(dashTab==='priv')renderPrivacy()}

applyLang();route();initDL();
fetch('model.json').then(r=>r.json()).then(j=>{
  M={classes:j.classes,roots:Int32Array.from(j.roots),f:Int8Array.from(j.f),t:Float64Array.from(j.t),l:Int32Array.from(j.l),r:Int32Array.from(j.r),v:j.v};
  goState='ready';setGo();
}).catch(()=>{goState='fail';setGo()});
</script>
